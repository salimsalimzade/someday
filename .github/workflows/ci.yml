# CI: lint, typecheck, test and build. Commit messages and file names are checked
# only locally, by the Lefthook hooks.
#
# Adding CD later: create .github/workflows/deploy.yml that runs on push to main,
# calls this workflow first (`jobs.ci.uses: ./.github/workflows/ci.yml`) and
# deploys in a job that `needs: ci`. Then remove the `push` trigger below so CI
# doesn't run twice per push.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A literal prefix, not github.workflow: in a called workflow that is the
# caller's name, which would put deploy and this run in the same group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # No version input: it reads packageManager from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci --error-on-warnings .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
