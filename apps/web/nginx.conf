server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API lives in the server container; same origin, so no CORS needed.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Always revalidate the entry point, so a deploy's new asset names are picked up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths fall back to the SPA.
  location / {
    try_files $uri /index.html;
  }
}
