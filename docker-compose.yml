# docker compose up --build   → web on http://localhost:8080, server on http://localhost:3000
name: bedrock

# Third-party services (postgres, redis, kafka, …) go in infra/, one file each, listed under
# an `include:` key here. See the Infra section of README.md.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
